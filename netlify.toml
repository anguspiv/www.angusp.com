[build]
  command = "set +e; echo '--- NODE ---'; node -v; npm -v; echo '--- NEXT BUILD ---'; npx next build 2>&1; echo 'NEXT_BUILD_EXIT='$?; echo '--- NEXT EXPORT ---'; npx next export 2>&1; echo 'NEXT_EXPORT_EXIT='$?; echo '--- OUT DIR ---'; ls -la out/ 2>&1 || true; rm -rf .next"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  CYPRESS_INSTALL_BINARY = "0"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[context.production.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[context.deploy-preview.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[context.branch-deploy.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/about"
  to = "/"
  status = 301
  force = true
