[build]
  command = "echo '=== node/npm ===' && node -v && npm -v && echo '=== next build ===' && npx next build 2>&1; echo "EXIT(next-build):$?"; npx next export 2>&1; echo "EXIT(next-export):$?"; rm -rf .next && echo '=== done ==='"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  CYPRESS_INSTALL_BINARY = "0"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[context.production.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[context.deploy-preview.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[context.branch-deploy.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/about"
  to = "/"
  status = 301
  force = true
